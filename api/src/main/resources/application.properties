micronaut.application.name=api
micronaut.server.max-request-size=15MB
micronaut.server.multipart.max-file-size=15MB
datasources.default.url=${JDBC_URL:`jdbc:postgresql://localhost:5433/hockey`}
datasources.default.username=${JDBC_USER:hockey}
datasources.default.password=${JDBC_PASSWORD:hockey}
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
flyway.datasources.default.enabled=true
openai.api-key=${OPENAI_API_KEY:}
# gpt-5-nano returned nothing for a 57-line board; gpt-5-mini read 55/57 with no errors
openai.model=${OPENAI_MODEL:gpt-5-mini}
# Sessions: Google sign-in issues a signed JWT in an HttpOnly cookie
micronaut.security.authentication=cookie
# Cookie sessions only: a Basic challenge on 401 would make browsers pop up a password dialog
micronaut.security.basic-auth.enabled=false
micronaut.security.token.bearer.enabled=false
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_SECRET}
micronaut.security.token.jwt.generator.access-token.expiration=2592000
micronaut.security.token.cookie.cookie-max-age=30d
micronaut.security.token.cookie.cookie-same-site=Lax
micronaut.security.redirect.login-success=/
micronaut.security.redirect.login-failure=/?login=failed
micronaut.security.redirect.logout=/
micronaut.security.redirect.unauthorized.enabled=false
micronaut.security.redirect.forbidden.enabled=false
micronaut.security.endpoints.logout.get-allowed=true
micronaut.security.oauth2.clients.google.client-id=${GOOGLE_CLIENT_ID:}
micronaut.security.oauth2.clients.google.client-secret=${GOOGLE_CLIENT_SECRET:}
micronaut.security.oauth2.clients.google.openid.issuer=https://accounts.google.com
micronaut.security.oauth2.clients.google.scopes=openid,email,profile
# Behind nginx: build the OAuth callback URL from the browser-facing host and scheme
micronaut.server.host-resolution.host-header=Host
micronaut.server.host-resolution.protocol-header=X-Forwarded-Proto
auth.allowed-domain=${AUTH_ALLOWED_DOMAIN:conta.no}
auth.dev-login=${DEV_LOGIN:false}
push.public-key=${VAPID_PUBLIC_KEY:}
push.private-key=${VAPID_PRIVATE_KEY:}
push.subject=${VAPID_SUBJECT:mailto:admin@conta.no}
